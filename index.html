<!DOCTYPE html>
<html>
<head>
    <title>Nasıl Hissediyorsun?</title>

    <style>
        body {
            text-align: center;
            margin-top: 250px;
            font-family: Arial, sans-serif;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 30px;
        }

        button {
            font-size: 25px;
            margin: 10px;
            padding: 10px 20px;
        }

        #sonuc {
            font-size: 75px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>Bu Gün Kendini Nasıl Hissediyorsun?</h1>

    <button onclick="goster('🎆')">İyiyim</button>
    <button onclick="goster('😐')">İdare Eder</button>
    <button onclick="goster('😭')">Kötüyüm</button>

    <div id="sonuc"></div>

    <script>
        function goster(emoji) {
            document.getElementById("sonuc").textContent = emoji;

            setTimeout(function() {
                document.getElementById("sonuc").textContent = "";
            }, 5000);
        }
    </script>

</body>
</html>
