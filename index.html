```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemek Testi</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            font-size: 22px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            display: none;
        }

        #fireworks {
            font-size: 80px;
            margin-bottom: 20px;
        }

        #backButton {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: none;
            font-size: 18px;
            padding: 12px 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="test">
            <h1 id="question">Bu Gün Yemek Testi Yapıcaz</h1>

            <div class="buttons" id="buttons">
                <button onclick="choose('İskender')">İskender</button>
                <button onclick="choose('Tavuk Döner')">Tavuk Döner</button>
                <button onclick="choose('Cheese Burger')">Cheese Burger</button>
            </div>
        </div>

        <div id="result">
            <div id="fireworks">🎆🎇🎆</div>
            <h1 id="resultText"></h1>
        </div>

    </div>

    <button id="backButton" onclick="restart()">Başa Dön</button>


    <script>

        let selectedFood = "";

        let stage = 0;

        const stages = [
            ["İskender", "Tavuk Döner", "Cheese Burger"],
            ["Hamburger", "Pizza"],
            ["Kanat", "Çıtır Tavuk"],
            ["Ciğer", "Söğüş"],
            ["Kokoreç", "Spagetti"],
            ["Lahmacun", "Pide"]
        ];

        function choose(food) {

            selectedFood = food;
            stage++;

            // Son aşamaya gelindiyse sonucu göster
            if (stage === stages.length) {
                finishTest();
                return;
            }

            let nextFoods = [selectedFood, ...stages[stage]];

            showButtons(nextFoods);
        }


        function showButtons(foods) {

            const buttons = document.getElementById("buttons");

            buttons.innerHTML = "";

            foods.forEach(food => {

                const button = document.createElement("button");

                button.textContent = food;

                button.onclick = function() {
                    choose(food);
                };

                buttons.appendChild(button);
            });
        }


        function finishTest() {

            document.getElementById("test").style.display = "none";

            document.getElementById("result").style.display = "block";

            document.getElementById("resultText").textContent =
                "Tebrikler! Sona kadar " + selectedFood + " getirdin!";

            setTimeout(function() {

                document.getElementById("backButton").style.display = "block";

            }, 5000);
        }


        function restart() {

            selectedFood = "";

            stage = 0;

            document.getElementById("result").style.display = "none";

            document.getElementById("test").style.display = "block";

            document.getElementById("backButton").style.display = "none";

            document.getElementById("buttons").innerHTML = `
                <button onclick="choose('İskender')">İskender</button>
                <button onclick="choose('Tavuk Döner')">Tavuk Döner</button>
                <button onclick="choose('Cheese Burger')">Cheese Burger</button>
            `;
        }

    </script>

</body>
</html>
```
