            font-size: 75px;

<body>

    <h1>Bu Gün Kendini Nasıl Hissediyorsun?</h1>

    <button onclick="goster('🎆')">İyiyim</button>

    <button onclick="goster('😐')">İdare Eder</button>

    <button onclick="goster('😭')">Kötüyüm</button>

    <div id="sonuc"></div>

    <script>
        function goster(emoji) {
            document.getElementById("sonuc").textContent = emoji;

            setTimeout(function() {
                document.getElementById("sonuc").textContent = "";
            }, 5000);
        }
    </script>

</body>
